name: ai-business-assistant
services:
  postgres:
    image: postgres:18.3-alpine3.23
    environment:
      POSTGRES_DB: aba
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?Set MIGRATOR_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d aba']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: ./apps/api
      target: migrate
    environment:
      MIGRATION_DATABASE_URL: postgresql://aba_migrator:${MIGRATOR_DB_PASSWORD}@postgres:5432/aba?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
  api:
    build:
      context: ./apps/api
      target: api
    environment:
      APP_ENV: development
      HTTP_ADDR: ':8080'
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_ENABLE_LIVE: ${LLM_ENABLE_LIVE:-false}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-2s}
      LLM_MAX_TOOL_CALLS: ${LLM_MAX_TOOL_CALLS:-3}
      LLM_INPUT_TOKENS: ${LLM_INPUT_TOKENS:-16000}
      LLM_OUTPUT_TOKENS: ${LLM_OUTPUT_TOKENS:-512}
      LLM_DAILY_REQUESTS: ${LLM_DAILY_REQUESTS:-40}
      LLM_DAILY_TOKENS: ${LLM_DAILY_TOKENS:-2000000}
      LLM_EXTERNAL_REQUESTS_AUTHORIZED: ${LLM_EXTERNAL_REQUESTS_AUTHORIZED:-false}
      LLM_KILL_SWITCH: ${LLM_KILL_SWITCH:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_ALLOWED_BASE_URLS: ${LLM_ALLOWED_BASE_URLS:-}
      LLM_PLATFORM_BUDGET_MICRORUB: ${LLM_PLATFORM_BUDGET_MICRORUB:-0}
      LLM_INPUT_MICRORUB_PER_MILLION: ${LLM_INPUT_MICRORUB_PER_MILLION:-0}
      LLM_OUTPUT_MICRORUB_PER_MILLION: ${LLM_OUTPUT_MICRORUB_PER_MILLION:-0}
      LLM_MAX_PARALLEL: ${LLM_MAX_PARALLEL:-2}
      LLM_RETRIES: ${LLM_RETRIES:-0}
      LLM_DIALOG_INPUT_TOKENS: ${LLM_DIALOG_INPUT_TOKENS:-20000}
      LLM_DIALOG_OUTPUT_TOKENS: ${LLM_DIALOG_OUTPUT_TOKENS:-5000}
      LLM_DIALOG_REQUESTS: ${LLM_DIALOG_REQUESTS:-30}
      TELEGRAM_EXTERNAL_REQUESTS_AUTHORIZED: ${TELEGRAM_EXTERNAL_REQUESTS_AUTHORIZED:-false}
      TELEGRAM_SENDING_ENABLED: ${TELEGRAM_SENDING_ENABLED:-false}
      TELEGRAM_SENDING_KILL_SWITCH: ${TELEGRAM_SENDING_KILL_SWITCH:-true}
      TELEGRAM_TEST_USER_IDS: ${TELEGRAM_TEST_USER_IDS:-}
      TELEGRAM_WEBHOOK_BASE_URL: ${TELEGRAM_WEBHOOK_BASE_URL:-}
      TELEGRAM_APPROVED_WEBHOOK_BASE_URL: ${TELEGRAM_APPROVED_WEBHOOK_BASE_URL:-}
      INVENTORY_FRESHNESS: ${INVENTORY_FRESHNESS:-24h}
      DATABASE_URL: postgresql://aba_app:${APP_DB_PASSWORD}@postgres:5432/aba?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WHATSAPP_ENCRYPTION_KEY: ${WHATSAPP_ENCRYPTION_KEY:-}
      WHATSAPP_LIVE_ENABLED: "false"
      WHATSAPP_SENDING_KILL_SWITCH: "true"
      WHATSAPP_EXTERNAL_REQUESTS_AUTHORIZED: "false"
      WHATSAPP_MONETARY_BUDGET_RUB: "0"
      TELEGRAM_ENCRYPTION_KEY: ${TELEGRAM_ENCRYPTION_KEY:-}
      TELEGRAM_TRANSPORT: ${TELEGRAM_TRANSPORT:-mock}
      TELEGRAM_RETENTION_DAYS: ${TELEGRAM_RETENTION_DAYS:-7}
      AUTH_EMAIL_KEY: ${AUTH_EMAIL_KEY:?Set AUTH_EMAIL_KEY}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:3000}
      SMTP_ADDR: mailpit:1025
      SESSION_TTL: ${SESSION_TTL:-168h}
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-24h}
      VERIFICATION_TTL: ${VERIFICATION_TTL:-24h}
    ports:
      - '127.0.0.1:${API_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, /app/healthcheck]
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 15s
    restart: unless-stopped
  worker:
    build:
      context: ./apps/api
      target: worker
    environment:
      APP_ENV: development
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_ENABLE_LIVE: ${LLM_ENABLE_LIVE:-false}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-2s}
      LLM_MAX_TOOL_CALLS: ${LLM_MAX_TOOL_CALLS:-3}
      LLM_INPUT_TOKENS: ${LLM_INPUT_TOKENS:-16000}
      LLM_OUTPUT_TOKENS: ${LLM_OUTPUT_TOKENS:-512}
      LLM_DAILY_REQUESTS: ${LLM_DAILY_REQUESTS:-40}
      LLM_DAILY_TOKENS: ${LLM_DAILY_TOKENS:-2000000}
      LLM_EXTERNAL_REQUESTS_AUTHORIZED: ${LLM_EXTERNAL_REQUESTS_AUTHORIZED:-false}
      LLM_KILL_SWITCH: ${LLM_KILL_SWITCH:-true}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_ALLOWED_BASE_URLS: ${LLM_ALLOWED_BASE_URLS:-}
      LLM_PLATFORM_BUDGET_MICRORUB: ${LLM_PLATFORM_BUDGET_MICRORUB:-0}
      LLM_INPUT_MICRORUB_PER_MILLION: ${LLM_INPUT_MICRORUB_PER_MILLION:-0}
      LLM_OUTPUT_MICRORUB_PER_MILLION: ${LLM_OUTPUT_MICRORUB_PER_MILLION:-0}
      LLM_MAX_PARALLEL: ${LLM_MAX_PARALLEL:-2}
      LLM_RETRIES: ${LLM_RETRIES:-0}
      LLM_DIALOG_INPUT_TOKENS: ${LLM_DIALOG_INPUT_TOKENS:-20000}
      LLM_DIALOG_OUTPUT_TOKENS: ${LLM_DIALOG_OUTPUT_TOKENS:-5000}
      LLM_DIALOG_REQUESTS: ${LLM_DIALOG_REQUESTS:-30}
      TELEGRAM_EXTERNAL_REQUESTS_AUTHORIZED: ${TELEGRAM_EXTERNAL_REQUESTS_AUTHORIZED:-false}
      TELEGRAM_SENDING_ENABLED: ${TELEGRAM_SENDING_ENABLED:-false}
      TELEGRAM_SENDING_KILL_SWITCH: ${TELEGRAM_SENDING_KILL_SWITCH:-true}
      TELEGRAM_TEST_USER_IDS: ${TELEGRAM_TEST_USER_IDS:-}
      TELEGRAM_WEBHOOK_BASE_URL: ${TELEGRAM_WEBHOOK_BASE_URL:-}
      TELEGRAM_APPROVED_WEBHOOK_BASE_URL: ${TELEGRAM_APPROVED_WEBHOOK_BASE_URL:-}
      INVENTORY_FRESHNESS: ${INVENTORY_FRESHNESS:-24h}
      DATABASE_URL: postgresql://aba_app:${APP_DB_PASSWORD}@postgres:5432/aba?sslmode=disable
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WHATSAPP_ENCRYPTION_KEY: ${WHATSAPP_ENCRYPTION_KEY:-}
      WHATSAPP_LIVE_ENABLED: "false"
      WHATSAPP_SENDING_KILL_SWITCH: "true"
      WHATSAPP_EXTERNAL_REQUESTS_AUTHORIZED: "false"
      WHATSAPP_MONETARY_BUDGET_RUB: "0"
      TELEGRAM_ENCRYPTION_KEY: ${TELEGRAM_ENCRYPTION_KEY:-}
      TELEGRAM_TRANSPORT: ${TELEGRAM_TRANSPORT:-mock}
      TELEGRAM_RETENTION_DAYS: ${TELEGRAM_RETENTION_DAYS:-7}
      AUTH_EMAIL_KEY: ${AUTH_EMAIL_KEY:?Set AUTH_EMAIL_KEY}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://127.0.0.1:3000}
      SMTP_ADDR: mailpit:1025
      SESSION_TTL: ${SESSION_TTL:-168h}
      SESSION_IDLE_TTL: ${SESSION_IDLE_TTL:-24h}
      VERIFICATION_TTL: ${VERIFICATION_TTL:-24h}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'kill -0 1']
      interval: 10s
      timeout: 2s
      retries: 3
    stop_grace_period: 15s
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - '127.0.0.1:${MAILPIT_PORT:-8025}:8025'
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: ./apps/web
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 10
    stop_grace_period: 15s
    restart: unless-stopped
volumes:
  postgres_data:
