                                    "button_reply": {
                                      "type": "object",
                                      "required": [
                                        "id"
                                      ],
                                      "properties": {
                                        "id": {
                                          "type": "string",
                                          "maxLength": 64,
                                          "pattern": "^(offer|confirm):[0-9a-f-]{36}$"
                                        }
                                      }
                                    }
                                  }
                                }
                              }
                            }
                          },
                          "statuses": {
                            "type": "array",
                            "maxItems": 50,
                            "items": {
                              "type": "object",
                              "required": [
                                "id",
                                "recipient_id",
                                "timestamp",
                                "status"
                              ],
                              "properties": {
                                "id": {
                                  "type": "string",
                                  "minLength": 1,
                                  "maxLength": 200
                                },
                                "recipient_id": {
                                  "type": "string",
                                  "pattern": "^[0-9]{1,20}$"
                                },
                                "timestamp": {
                                  "type": "string",
                                  "pattern": "^[0-9]{1,20}$"
                                },
                                "status": {
                                  "type": "string",
                                  "enum": [
                                    "sent",
                                    "delivered",
                                    "read",
                                    "failed"
                                  ]
                                }
                              }
                            }
                          }
                        },
                        "description": "Не менее одного message/status, в сумме не более50; проверяются routing/allowlist. Other provider metadata ignored."
                      }
                    }
                  }
                }
              }
            }
          }
        }
      },
      "WhatsAppFinancialState": {
        "type": "object",
