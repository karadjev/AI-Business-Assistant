{
  "openapi": "3.0.3",
  "info": {
    "title": "AI Business Assistant infrastructure API",
    "version": "0.10.1",
    "description": "Реализованные API этапов 2–7: auth, организации, каталог, заявки, тестовые диалоги, mock Telegram и подготовка live. Текущая конфигурация запрещает внешние вызовы; live E2E NOT RUN. Offline recovery: manual delivery acknowledgement без resend; budget UNKNOWN с полным консервативным списанием. Этап 8Б.2: WhatsApp mock, HMAC webhook, общие агент/заявки, channel delivery recovery. Live Meta запрещён, бюджет0. Этап9Б: owner-only WhatsApp financial state/templates/diagnostic/reconciliation; registry и ledger offline, live disabled, оба budgets0. Этап9В: operator-scoped evidence reconciliation и provider status/revocation; owner не может выполнять сверку. Только offline mock. Этап10А: owner store profile/onboarding и bounded XLSX upload/mapping/preview/atomic confirmation в едином каталоге, strict offline. Instagram Stage2: durable mock-only connection/state/shared queue. Live disabled; PostgreSQL isolation gate pending execution."
  },
