          },
          "503": {
            "description": "Runtime disabled"
          }
        }
      },
      "post": {
        "operationId": "receiveInstagramWebhook",
        "summary": "HMAC before account resolution; atomic shared inbox enqueue before acknowledgement. No HTTP AI work.",
        "security": [],
        "parameters": [
          {
            "name": "integration",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "X-Hub-Signature-256",
            "in": "header",
