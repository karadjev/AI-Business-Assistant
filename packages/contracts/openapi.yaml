              },
              "reserved": {
                "type": "integer",
                "format": "int64",
                "minimum": 0
              },
              "spent": {
                "type": "integer",
                "format": "int64",
                "minimum": 0
              },
              "available": {
                "type": "integer",
                "format": "int64",
                "minimum": 0
              },
              "synthetic": {
                "type": "boolean"
              }
            }
          },
          "reasons": {
