            "schema": {
              "type": "string",
              "pattern": "^sha256=[0-9a-f]{64}$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "description": "Bounded provider payload, maximum 65536 bytes."
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Durably accepted or duplicate/ignored event"
          },
          "403": {
            "description": "Signature/account rejected"
          },
          "413": {
            "description": "Payload limit"
          },
          "429": {
            "description": "Rate limit"
          },
          "503": {
            "description": "Unavailable; retry permitted, no acknowledgement of data loss"
          }
        }
      }
