                    "charged",
                    "released"
                  ]
                },
                "amount": {
                  "type": "integer",
                  "format": "int64",
                  "minimum": 0
                },
                "charged": {
                  "type": "integer",
                  "format": "int64",
                  "minimum": 0
                },
                "version": {
                  "type": "integer",
                  "format": "int64"
                },
                "synthetic": {
                  "type": "boolean"
                }
              }
            }
          }
        }
      },
      "WhatsAppTemplateRecord": {
        "type": "object",
