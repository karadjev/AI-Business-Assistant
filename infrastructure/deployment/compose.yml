# Private staging package. No host ports, external networks, build/pull or socket.
name: aba-private-staging
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}
x-runtime: &runtime
  image: ${ABA_API_IMAGE:?Set verified API image}
  pull_policy: never
  user: '10001:10001'
  read_only: true
  tmpfs: ['/tmp:size=32m,mode=1777']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [private]
  dns: [127.0.0.1]
  restart: unless-stopped
  init: false
  stop_grace_period: 30s
  logging: *logging
  cpus: 0.75
  mem_limit: 512m
  pids_limit: 128
  environment: &runtime-env
    APP_ENV: staging
    DATABASE_URL_FILE: /run/secrets/database_url
    AUTH_EMAIL_KEY_FILE: /run/secrets/auth_email_key
    CATALOG_RETENTION_KEY_FILE: /run/secrets/retention_key
    TELEGRAM_ENCRYPTION_KEY_FILE: /run/secrets/telegram_key
    WHATSAPP_ENCRYPTION_KEY_FILE: /run/secrets/whatsapp_key
    PUBLIC_ORIGIN: ${ABA_PUBLIC_ORIGIN:?Set HTTPS origin}
    SMTP_ADDR: mailpit:1025
    ABA_DISABLE_EMAIL_ACTIONS: ${ABA_DISABLE_EMAIL_ACTIONS:-false}
    DB_MAX_CONNECTIONS: '5'
    LLM_PROVIDER: mock
    LLM_ENABLE_LIVE: 'false'
    LLM_EXTERNAL_REQUESTS_AUTHORIZED: 'false'
    LLM_KILL_SWITCH: 'true'
    LLM_PLATFORM_BUDGET_MICRORUB: '0'
    TELEGRAM_TRANSPORT: mock
    TELEGRAM_EXTERNAL_REQUESTS_AUTHORIZED: 'false'
    TELEGRAM_SENDING_ENABLED: 'false'
    TELEGRAM_SENDING_KILL_SWITCH: 'true'
    WHATSAPP_LIVE_ENABLED: 'false'
    WHATSAPP_SENDING_KILL_SWITCH: 'true'
    WHATSAPP_EXTERNAL_REQUESTS_AUTHORIZED: 'false'
    WHATSAPP_MONETARY_BUDGET_RUB: '0'
    INSTAGRAM_ENABLED: 'false'
    INSTAGRAM_LIVE_ENABLED: 'false'
    INSTAGRAM_EXTERNAL_REQUESTS_AUTHORIZED: 'false'
    INSTAGRAM_SENDING_KILL_SWITCH: 'true'
    INSTAGRAM_MONETARY_BUDGET_RUB: '0'
  secrets: [database_url, auth_email_key, retention_key, telegram_key, whatsapp_key, db_ca]
services:
  postgres:
    image: ${ABA_POSTGRES_IMAGE:?Set reviewed PostgreSQL image}
    pull_policy: never
    environment:
      POSTGRES_DB: aba_stage
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [admin_password, app_password, migrator_password, db_certificate, db_key]
    volumes:
      - database:/var/lib/postgresql
      - ./init-roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
      - ./pg_hba.conf:/etc/aba/pg_hba.conf:ro
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/secrets/db_certificate, -c, ssl_key_file=/run/secrets/db_key, -c, hba_file=/etc/aba/pg_hba.conf, -c, shared_buffers=512MB, -c, max_connections=30, -c, log_statement=none, -c, log_min_error_statement=panic, -c, log_parameter_max_length_on_error=0]
    networks: [private]
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 256m
    cpus: 1.5
    mem_limit: 2g
    pids_limit: 128
    logging: *logging
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, aba_stage]
      interval: 5s
      timeout: 3s
      retries: 24
  migrate:
    <<: *runtime
    command: [migrate, up]
    restart: 'no'
    environment:
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets: [migration_database_url, db_ca]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *runtime
    command: [api]
    depends_on:
      migrate: {condition: service_completed_successfully}
      mailpit: {condition: service_started}
    healthcheck:
      test: [CMD, /app/healthcheck]
      interval: 5s
      timeout: 3s
      retries: 24
  worker:
    <<: *runtime
    command: [worker]
    environment:
      <<: *runtime-env
      CONVERSATIONAL_ORCHESTRATION_ENABLED: 'true'
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      # Liveness only. Does not claim successful queue processing or DB readiness.
      test: [CMD, /app/runtime-entrypoint, worker-live]
      interval: 10s
      timeout: 3s
      retries: 3
  web:
    image: ${ABA_WEB_IMAGE:?Set verified web image}
    pull_policy: never
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    user: '10001:10001'
    environment:
      API_BASE_URL: http://api:8080
      ABA_DISABLE_EMAIL_ACTIONS: ${ABA_DISABLE_EMAIL_ACTIONS:-false}
      NEXT_TELEMETRY_DISABLED: '1'
    networks: [private]
    dns: [127.0.0.1]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 128
    logging: *logging
    healthcheck:
      test: [CMD, /usr/bin/node, -e, 'fetch("http://127.0.0.1:3000/login",{redirect:"manual"}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 24
  proxy:
    image: ${ABA_PROXY_IMAGE:?Set reviewed reverse proxy image}
    pull_policy: never
    user: '101:101'
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [nginx, -g, 'daemon off;']
    volumes: [./nginx.conf:/etc/nginx/nginx.conf:ro]
    secrets: [proxy_certificate, proxy_key]
    depends_on:
      web: {condition: service_healthy}
    networks:
      private:
        ipv4_address: ${ABA_PROXY_ADDRESS:?Set internal proxy address in the reviewed subnet}
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    logging: *logging
    healthcheck:
      test: [CMD, nginx, -t]
      interval: 10s
      timeout: 3s
      retries: 3
  mailpit:
    image: ${ABA_MAILPIT_IMAGE:?Set reviewed local mail sink image}
    pull_policy: never
    user: '10001:10001'
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_DATABASE: /tmp/mailpit.db
    networks: [private]
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    logging: *logging
networks:
  private:
    internal: true
    ipam:
      config: [{subnet: '${ABA_PRIVATE_SUBNET:?Set reviewed non-overlapping private subnet}'}]
volumes:
  database:
secrets:
  database_url: {file: '${ABA_SECRETS_DIR:?}/database_url'}
  migration_database_url: {file: '${ABA_SECRETS_DIR:?}/migration_database_url'}
  auth_email_key: {file: '${ABA_SECRETS_DIR:?}/auth_email_key'}
  retention_key: {file: '${ABA_SECRETS_DIR:?}/retention_key'}
  telegram_key: {file: '${ABA_SECRETS_DIR:?}/telegram_key'}
  whatsapp_key: {file: '${ABA_SECRETS_DIR:?}/whatsapp_key'}
  admin_password: {file: '${ABA_SECRETS_DIR:?}/admin_password'}
  app_password: {file: '${ABA_SECRETS_DIR:?}/app_password'}
  migrator_password: {file: '${ABA_SECRETS_DIR:?}/migrator_password'}
  db_ca: {file: '${ABA_SECRETS_DIR:?}/db_ca'}
  db_certificate: {file: '${ABA_SECRETS_DIR:?}/db_certificate'}
  db_key: {file: '${ABA_SECRETS_DIR:?}/db_key'}
  proxy_certificate: {file: '${ABA_SECRETS_DIR:?}/proxy_certificate'}
  proxy_key: {file: '${ABA_SECRETS_DIR:?}/proxy_key'}
