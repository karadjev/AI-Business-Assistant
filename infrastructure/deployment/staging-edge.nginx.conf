# Ubuntu host edge. Only the two reviewed virtual hosts reach the private proxy.
map $host $aba_staging_proxy_port {
    default 8443;
    api.ai-business-store.com 8444;
}

server {
    listen 80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 80;
    server_name ai-business-store.com api.ai-business-store.com;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/aba-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
    return 421;
}

server {
    listen 443 ssl;
    server_name ai-business-store.com api.ai-business-store.com;
    ssl_certificate /etc/letsencrypt/live/ai-business-store.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-business-store.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    error_log /var/log/nginx/aba-staging-error.log crit;
    server_tokens off;
    client_max_body_size 10m;
    auth_basic "AI Business Assistant staging";
    auth_basic_user_file /etc/nginx/aba-staging.htpasswd;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;

    location = /api/v1/webhooks { return 404; }
    location ^~ /api/v1/webhooks/ { return 404; }
    location / {
        proxy_pass https://10.254.250.10:$aba_staging_proxy_port;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/aba-staging-upstream-ca.pem;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_redirect off;
    }
}
