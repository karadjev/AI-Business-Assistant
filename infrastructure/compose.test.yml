# Isolated stack: no production volume, no published DB port.
services:
  test-postgres:
    image: postgres:18.3-alpine3.23
    environment:
      POSTGRES_DB: aba_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_test_admin
      APP_DB_PASSWORD: local_test_app
      MIGRATOR_DB_PASSWORD: local_test_migrator
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d aba_test']
      interval: 2s
      timeout: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.21
  integration:
    image: golang:1.26.2-alpine3.23
    working_dir: /src
    volumes:
      - ../apps/api:/src:ro
    environment:
      ABA_TEST_DATABASE_URL: postgresql://aba_app:local_test_app@test-postgres:5432/aba_test?sslmode=disable
      ABA_TEST_MIGRATION_DATABASE_URL: postgresql://aba_migrator:local_test_migrator@test-postgres:5432/aba_test?sslmode=disable
      TEST_MAILPIT_URL: http://mailpit:8025
      GOCACHE: /tmp/go-build
      GOMODCACHE: /tmp/go-mod
    depends_on:
      test-postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: [sh, -ec, "cp -R /src /tmp/aba-api && cd /tmp/aba-api && apk add --no-cache gcc musl-dev && go test -race -tags=integration -count=1 -v ./tests/integration"]
